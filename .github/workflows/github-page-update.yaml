  name: "GitHub Page: Build and Deploy"

  on:
    workflow_call:
      inputs:
        includes:
          description: "Files and directories to keep in the workspace"
          required: false
          type: string
          default: ""

    workflow_dispatch:
      inputs:
        includes:
          description: "Files and directories to keep in the workspace"
          required: false
          type: string
          default: ""

  permissions:
    contents: read

  env:
    WORKSPACE: .github-page-update

  concurrency:
    group: "github-page-update"
    cancel-in-progress: true

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v6
          with:
            path: ${{ env.WORKSPACE }}

        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: 3.1
            bundler-cache: false

        - name: Build Jekyll
          shell: bash
          env:
            INCLUDES: ${{ inputs.includes }}
          run: |
            set -euo pipefail
            
            cd "$GITHUB_WORKSPACE/$WORKSPACE"

            # Filter includes, if includes have been set
            if [[ -n "${INCLUDES//[[:space:]]/}" ]]; then
              WORKSPACE_TEMP="${WORKSPACE}-temp"
              mv "$WORKSPACE" "$WORKSPACE_TEMP"
              mkdir -p "$WORKSPACE"
              while IFS= read -r path; do
                [[ -z "${path//[[:space:]]/}" ]] && continue
                path="$(echo "$path" | xargs)"
                path="./$(echo "$path" | sed -E 's#/{2,}#/#g; s#^\./##')"
                mv "${$WORKSPACE_TEMP}/${path#./}" "$WORKSPACE/"
              done <<< "${inputs.includes}"
              rm -rf "$WORKSPACE_TEMP"
            fi
            
            # Filter for Liquid expressions and GitHub specials in Markdown
            find . -type f -name "*.md" -print0 |
            while IFS= read -r -d '' file; do
              sed -E -i \
                  -e 's/(\{\{.*?\}\})/{% raw %}\1{% endraw %}/g' \
                  -e 's/^> \[!NOTE\]/> __Note__  /' \
                  -e 's/^> \[!TIP\]/> __Tip__  /' \
                  -e 's/^> \[!IMPORTANT\]/> __Important__  /' \
                  -e 's/^> \[!WARNING\]/> __Warning__  /' \
                  -e 's/^> \[!CAUTION\]/> __Caution__  /' \
                  "$file"
            done
            
            # Create Gemfile and Jekyll config
            printf '%s\n' \
              'source "https://rubygems.org"' \
              'gem "github-pages", group: :jekyll_plugins' \
              > Gemfile
            
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            
            printf '%s\n' \
                "url: \"https://${GITHUB_REPOSITORY_OWNER}.github.io\"" \
                "baseurl: \"/${REPO_NAME}\"" \
                > _config.yaml
            
            # Install dependencies
            bundle config set path vendor/bundle
            bundle install
            
            # Build Jekyll site
            bundle exec jekyll build \
              --source ./ \
              --destination _site \
              --config _config.yaml

        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v5
          with:
            path: ${{ env.WORKSPACE }}/_site

        - name: Remove temporary workspace
          if: always()
          run: |
            rm -rf -- "$GITHUB_WORKSPACE/$WORKSPACE"

    deploy:
      needs: build
      runs-on: ubuntu-latest

      permissions:
        contents: read
        pages: write
        id-token: write

      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v5
